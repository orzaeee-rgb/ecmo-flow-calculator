<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECMO Flow Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icons/icon-192-v2.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/icon-192-v2.png"
    >
    <meta name="theme-color" content="#1976d2">
</head>
<body>

<div class="container">

    <h1>🫀 ECMO Flow Calculator</h1>

    <p>Body Surface Area (BSA) × Cardiac Index (CI)</p>

    <label>Height (cm)</label>
    <input type="number" id="height">

    <label>Weight (kg)</label>
    <input type="number" id="weight">

    <div class="form-group">

    <label for="ecmoMachine">ECMO Machine</label>

    <select id="ecmoMachine">
        <option value="">Select ECMO Machine</option>
        <option value="Cardiohelp">Cardiohelp</option>
        <option value="ECMOLIFE">ECMOLIFE</option>
        <option value="Medtronic">Medtronic</option>
    </select>
    </div>

    <button id="btnCalculate">
        Calculate
    </button>

    <div id="result"></div>

    <button id="btnPrint">
        Print
    </button>

</div>

<script src="script.js"></script>

</html>
